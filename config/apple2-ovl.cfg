# Linker config for AUX-RAM overlay binaries.
# Each overlay is a raw 2KB binary loaded at $8800 (OVERLAY_SLOT).
# No startup, no DOS header — just code + rodata + cc65 runtime helpers.
#
# External references (ui functions + render_warehouse_box) are resolved
# via the jump table permanently installed at $080F in MAIN RAM.
# Verify these addresses match iimperialism.map after each build.
#
# ZP region matches main binary ($80-$99) so that cc65 runtime helpers
# (pushax, decsp*, sp) share the same zero-page addresses as the main program.

MEMORY {
    ZP:      file = "",  start = $0080, size = $001A;
    OVL:     file = %O,  start = $8800, size = $0800, fillval = $00, fill = yes;
    DISCARD: file = "",  start = $A000, size = $4000;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp,  optional = yes;
    CODE:     load = OVL,     type = ro;
    RODATA:   load = OVL,     type = ro,  optional = yes;
    DATA:     load = OVL,     type = rw,  optional = yes;
    STARTUP:  load = DISCARD, type = ro,  optional = yes;
    EXEHDR:   load = DISCARD, type = ro,  optional = yes;
    INIT:     load = DISCARD, type = rw,  optional = yes;
    ONCE:     load = DISCARD, type = ro,  optional = yes;
    BSS:      load = DISCARD, type = bss, optional = yes;
    LOWBSS:   load = DISCARD, type = bss, optional = yes;
    LOWCODE:  load = DISCARD, type = ro,  optional = yes;
}

SYMBOLS {
    _clear_screen:             type = export, value = $080F;
    _clear_input_area:         type = export, value = $0812;
    _print:                    type = export, value = $0815;
    _print_int_right_aligned:  type = export, value = $0818;
    _draw_picture_at:          type = export, value = $081B;
    _box:                      type = export, value = $081E;
    _render_warehouse_box:     type = export, value = $0821;
    _cgetc:                    type = export, value = $0824;
    _scan_uint:                type = export, value = $0827;
    _print_int:                type = export, value = $082A;
    _get_resource_name:        type = export, value = $082D;
    _get_relation_name:        type = export, value = $0830;
    _set_selected_trade_nation:type = export, value = $0833;
    _get_selected_trade_nation:type = export, value = $0836;
    _clear_area:               type = export, value = $0839;
    _get_trade_max_quantity:   type = export, value = $083C;
    _apply_trade:              type = export, value = $083F;
    _paint_area:               type = export, value = $0842;
    _rand_range:               type = export, value = $0845;
    _state:                    type = export, value = $8024;
}
